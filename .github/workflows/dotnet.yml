# Build check for pull requests and feature branches. Pushes to main are covered by plesk-deploy.yml,
# which does the same build before publishing — running both there would just build twice.

name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches-ignore: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Pinned rather than ubuntu-latest: the runner image changes when we choose.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Exact SDK version on purpose. A floating version (10.0.x) makes the install script look the
      # download up through aka.ms, which currently redirects to a Microsoft storage account that refuses
      # public downloads (HTTP 409 "Public access is not permitted") and fails the job. An exact version
      # downloads straight from builds.dotnet.microsoft.com. Bump it when a new SDK ships:
      # https://dotnet.microsoft.com/download/dotnet/10.0 (keep it in step with the 10.0.x packages).
      # setup-dotnet's own "latest LTS runtime" pre-install still goes through aka.ms and may log a
      # warning; that step is non-fatal.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.402'

      - name: Restore
        run: dotnet restore SpeakingClub.csproj

      - name: Build
        run: dotnet build SpeakingClub.csproj --configuration Release --no-restore

      # Unit tests for the report statistics (tests/SpeakingClub.Tests)
      - name: Test
        run: dotnet test tests/SpeakingClub.Tests --configuration Release

      # The deploy runs this tool only when a migration is pending, so a break in it would otherwise
      # surface in the middle of a deploy.
      - name: Build database backup tool
        run: dotnet build .github/tools/DbBackup --configuration Release
