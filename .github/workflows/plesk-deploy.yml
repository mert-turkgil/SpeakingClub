# Deploys almanca-konus.com to Plesk over FTP on every push to main.
#
# What happens, in order:
#   1. Build and publish the .NET app; drop in .github/deploy/web.config (Production environment).
#   2. Ask the production database which EF migrations it has not seen yet (both contexts:
#      SpeakingClubContext and ApplicationDbContext). If the database cannot be reached, the deploy
#      stops here — before anything on the server has been touched.
#   3. If there are pending migrations, export a .bacpac backup of the production database and
#      upload it to /<BACKUP_DIR>/ on the FTP account, then apply the migrations. (In Production the
#      app itself only migrates an empty database — see "Database Migration and Seeding" in
#      Program.cs — so this step is what keeps the schema current.)
#   4. Put app_offline.htm in place so IIS stops the app and releases its file locks, wait, upload
#      the publish output, then remove app_offline.htm so IIS starts the new build.
#   5. Smoke check: /health must answer and the home page must not return a 5xx.
#
# The FTP account's home directory is httpdocs\publish (the site root), so FTP paths below are
# relative to that folder.
#
# Things that live only on the server survive deployments: appsettings.Production.json (connection
# string, SMTP, API keys — gitignored, never uploaded from here), logs/, wwwroot/uploads. The FTP sync
# only deletes files it uploaded itself. Never turn on dangerous-clean-slate — that would wipe them.

name: Deploy to Plesk

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read

# Two pushes in quick succession must not interleave their FTP uploads.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SITE_BASE_URL: 'https://www.almanca-konus.com'

  # --- Deployment mechanics ------------------------------------------------------------------------
  # How long to wait after app_offline.htm lands before uploading DLLs. IIS can be slow to release
  # file locks; uploads that hit a locked DLL fail the whole deploy.
  OFFLINE_WAIT_SECONDS: '300'
  PUBLISH_DIR: publish

  # --- Pre-migration database backup ---------------------------------------------------------------
  # A .bacpac (schema + data) exported with SqlPackage and uploaded to /<BACKUP_DIR>/ in the FTP
  # home (httpdocs\publish). It is not web-reachable: IIS hands every request to the ASP.NET Core
  # app, which only serves static files from wwwroot/. Taken only when a deploy has migrations to
  # apply (or always, with BACKUP_ALWAYS). Restoring: see .github/deploy/RESTORE.md.
  BACKUP_DIR: '_db-backups'
  BACKUP_KEEP: '10'
  BACKUP_ALWAYS: 'false'

  # The EF contexts that own migrations, in the order they are applied.
  # DataProtectionKeysContext has no migrations: the app creates its table on startup.
  EF_CONTEXTS: 'SpeakingClubContext ApplicationDbContext'

jobs:
  publish-and-deploy:
    # Pinned rather than ubuntu-latest: the runner image changes when we choose, not mid-deploy.
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Check required secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PROD_CONNECTION_STRING: ${{ secrets.PROD_CONNECTION_STRING }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD PROD_CONNECTION_STRING; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      # --- Build -----------------------------------------------------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SpeakingClub.csproj

      - name: Publish
        run: >
          dotnet publish SpeakingClub.csproj
          --configuration Release
          --no-restore
          --output ${{ env.PUBLISH_DIR }}

      - name: Add web.config and verify publish output
        run: |
          cp .github/deploy/web.config "$PUBLISH_DIR/web.config"
          cd "$PUBLISH_DIR"
          for f in SpeakingClub.dll web.config appsettings.json wwwroot; do
            [ -e "$f" ] || { echo "::error::Expected $f in the publish output."; exit 1; }
          done
          for f in appsettings.Development.json appsettings.Production.json; do
            [ ! -e "$f" ] || { echo "::error::$f must not be published from CI — it would overwrite the server's copy."; exit 1; }
          done

      # --- Database --------------------------------------------------------------------------------
      # Runs against the bin/Release output from publish (--no-build) and before the site goes
      # offline, so a failed migration leaves the old build running untouched.
      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.0.11

      # `migrations list --json` marks each migration "applied": true/false, or null when the
      # database could not be reached. Null is treated as a failure: without it the deploy would
      # think nothing is pending and skip the backup.
      - name: Check for pending migrations
        id: pending
        env:
          # dotnet ef's design-time host defaults to Development, which would try to load
          # appsettings.Development.json and the SMTP checks in Program.cs. --connection below
          # supplies the database.
          ASPNETCORE_ENVIRONMENT: Production
          PROD_CONNECTION_STRING: ${{ secrets.PROD_CONNECTION_STRING }}
        run: |
          total=0
          for ctx in $EF_CONTEXTS; do
            out=$(dotnet ef migrations list \
              --project SpeakingClub.csproj \
              --context "$ctx" \
              --configuration Release \
              --no-build \
              --json \
              --connection "$PROD_CONNECTION_STRING" 2>&1) || { printf '%s\n' "$out"; exit 1; }
            json=$(printf '%s\n' "$out" | sed -n '/^\[/,$p')
            if [ -z "$json" ] || printf '%s' "$json" | jq -e 'any(.[]; .applied == null)' > /dev/null; then
              printf '%s\n' "$out"
              echo "::error::Could not read migration state for $ctx from the production database. Check PROD_CONNECTION_STRING and that the SQL Server accepts remote connections from GitHub."
              exit 1
            fi
            pending=$(printf '%s' "$json" | jq '[.[] | select(.applied == false)] | length')
            echo "$ctx: $pending pending"
            printf '%s' "$json" | jq -r '.[] | select(.applied == false) | "  - " + .id'
            total=$((total + pending))
          done
          echo "count=$total" >> "$GITHUB_OUTPUT"
          echo "Pending migrations: $total"

      # SqlPackage export works with the database's own login — no BACKUP DATABASE permission or
      # server-side file path needed. The site is still online during the export. If the export
      # fails the deploy stops here, before anything has been changed.
      - name: Back up production database
        if: steps.pending.outputs.count != '0' || env.BACKUP_ALWAYS == 'true'
        env:
          PROD_CONNECTION_STRING: ${{ secrets.PROD_CONNECTION_STRING }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          dotnet tool install --global microsoft.sqlpackage
          file="almanca-konus-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}.bacpac"

          "$HOME/.dotnet/tools/sqlpackage" /Action:Export \
            /SourceConnectionString:"$PROD_CONNECTION_STRING" \
            /TargetFile:"$file"
          ls -la "$file"

          # --ftp-create-dirs makes the backup folder on the first run.
          curl --silent --show-error --fail --ftp-create-dirs \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file "$file" \
            "ftp://$FTP_SERVER/$BACKUP_DIR/$file"
          echo "Uploaded to /$BACKUP_DIR/$file"
          {
            echo "### Database backup"
            echo "Pending migrations: **${{ steps.pending.outputs.count }}** — exported \`/$BACKUP_DIR/$file\` ($(du -h "$file" | cut -f1)) before applying them."
            echo "Restore instructions: .github/deploy/RESTORE.md"
          } >> "$GITHUB_STEP_SUMMARY"

          # Retention: names sort chronologically, so keep the last BACKUP_KEEP and delete the rest.
          existing=$(curl --silent --show-error --fail --list-only \
            --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/$BACKUP_DIR/" \
            | sed 's|.*/||' | grep -E '^almanca-konus-.*\.bacpac$' | sort)
          total=$(printf '%s\n' "$existing" | grep -c . || true)
          if [ "$total" -gt "$BACKUP_KEEP" ]; then
            printf '%s\n' "$existing" | head -n $((total - BACKUP_KEEP)) | while read -r old; do
              # Housekeeping only: the new backup is already safe, so a failed delete just warns.
              if curl --silent --show-error --fail \
                   --user "$FTP_USERNAME:$FTP_PASSWORD" \
                   --quote "DELE $BACKUP_DIR/$old" --list-only "ftp://$FTP_SERVER/$BACKUP_DIR/" \
                   --output /dev/null; then
                echo "Deleted old backup $old"
              else
                echo "::warning::Could not delete old backup $old — remove it by hand in Plesk → Dosyalar."
              fi
            done
          fi

      - name: Apply database migrations
        if: steps.pending.outputs.count != '0'
        env:
          ASPNETCORE_ENVIRONMENT: Production
          PROD_CONNECTION_STRING: ${{ secrets.PROD_CONNECTION_STRING }}
        run: |
          for ctx in $EF_CONTEXTS; do
            echo "== $ctx"
            dotnet ef database update \
              --project SpeakingClub.csproj \
              --context "$ctx" \
              --configuration Release \
              --no-build \
              --connection "$PROD_CONNECTION_STRING"
          done

      # --- Deploy ----------------------------------------------------------------------------------
      # app_offline.htm is handled with plain curl rather than the sync action: the sync action keeps
      # a state file, and a second run would see "already uploaded, unchanged" and skip it.
      - name: Take site offline (upload app_offline.htm)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: >
          curl --silent --show-error --fail
          --user "$FTP_USERNAME:$FTP_PASSWORD"
          --upload-file .github/deploy/app_offline.htm
          "ftp://$FTP_SERVER/app_offline.htm"

      - name: Wait for IIS to release file locks
        run: sleep "$OFFLINE_WAIT_SECONDS"

      # If this upload fails the site stays on the maintenance page (app_offline.htm) rather than
      # starting a half-uploaded build. Re-run the workflow to finish the deploy.
      - name: Upload publish output
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ${{ env.PUBLISH_DIR }}/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            app_offline.htm

      - name: Bring site online (delete app_offline.htm)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: >
          curl --silent --show-error --fail
          --user "$FTP_USERNAME:$FTP_PASSWORD"
          --quote "DELE app_offline.htm"
          --list-only
          "ftp://$FTP_SERVER/"
          --output /dev/null

      # The first request after a deploy is what makes IIS start the app, so this doubles as warm-up.
      # /health answers {"status":"Healthy|Unhealthy"} (database reachable or not). The home page is
      # checked too: it renders the shared layout, so a 5xx there means every page is down.
      - name: Smoke check
        run: |
          code=000; json=""
          for attempt in 1 2 3 4 5 6 7 8; do
            body=$(curl --silent --show-error --max-time 60 \
              --write-out "\n%{http_code}" "$SITE_BASE_URL/health" || true)
            code=$(echo "$body" | tail -n1)
            json=$(echo "$body" | sed '$d')
            [ "$code" = "200" ] && break
            sleep 15
          done
          echo "/health → HTTP $code: $json"
          case "$code" in
            200) ;;
            503) echo "::error::The site reports Unhealthy (database unreachable): $json"; exit 1 ;;
            *)   echo "::error::/health did not answer 200 (HTTP $code). Check logs/stdout_*.log on the server."; exit 1 ;;
          esac

          home=$(curl --silent --output /dev/null --max-time 60 --write-out "%{http_code}" "$SITE_BASE_URL/" || true)
          echo "/ → HTTP $home"
          case "$home" in
            5*) echo "::error::The home page returns HTTP $home. Check logs/stdout_*.log on the server."; exit 1 ;;
          esac

# ---------------------------------------------------------------------------------------------------
# Repository secrets this workflow reads (GitHub → Settings → Secrets and variables → Actions):
#
#   FTP_SERVER              Plesk FTP host name only, no protocol
#   FTP_USERNAME            Plesk FTP user (home directory: /httpdocs\publish)
#   FTP_PASSWORD            Plesk FTP password
#   PROD_CONNECTION_STRING  The production database's connection string as reachable FROM THE
#                           INTERNET — the server's public host name or IP (Plesk → Veritabanları →
#                           Bağlantı bilgisi), not ".\MSSQLSERVER2022", which only works on the server
#                           itself. Add TrustServerCertificate=True unless the server has a trusted
#                           certificate. SQL Server must accept remote connections on its port.
# ---------------------------------------------------------------------------------------------------
