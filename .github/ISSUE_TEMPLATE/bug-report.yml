name: 🐞 Bug report
description: Something on the site or in the admin panel doesn't work as it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! For **security problems**, please don't open a public issue:
        use [private vulnerability reporting](https://github.com/mert-turkgil/SpeakingClub/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /sozluk
        2. Search for "…"
        3. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where?
      options:
        - Public site (home, blog, about, contact)
        - Dictionary
        - Quizzes / exam room / results
        - Account (sign-up, login, profile)
        - Admin panel
        - Deployment / CI
        - Other
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome 140 on Android, Safari on iPhone, Edge on Windows 11
  - type: dropdown
    id: language
    attributes:
      label: Site language
      options:
        - Turkish
        - German
        - Both
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs or anything else
      description: Please remove personal data (names, emails) before posting.
